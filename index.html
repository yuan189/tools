<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>流水线 PRO</title>
    <!-- PWA 配置 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
        body { background-color: #000; color: #fff; touch-action: none; overflow: hidden; height: 100vh; font-family: sans-serif; }
        #viewport { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        canvas { max-width: 100%; max-height: 100%; object-fit: contain; cursor: crosshair; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="range"] { accent-color: #3b82f6; height: 8px; border-radius: 4px; }
        .focus-hidden { transition: all 0.3s ease; }
        .is-focus .focus-hidden { opacity: 0 !important; pointer-events: none !important; transform: translateY(10px); }
        .panel-glass { background: rgba(20, 20, 22, 0.9); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .loading-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .btn-active:active { transform: scale(0.9); transition: 0.1s; }
        /* 针对数位板的优化：禁止长按弹出菜单 */
        * { -webkit-touch-callout: none; -webkit-user-select: none; }
    </style>
</head>
<body class="flex flex-col">

    <div id="loader" class="loading-overlay">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loader-text" class="text-xs font-bold tracking-widest text-blue-500 uppercase">处理中...</p>
    </div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-[100] w-72 bg-[#0c0c0d] border-r border-white/5 transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
        <div class="p-6 border-b border-white/5 flex justify-between items-center pt-[calc(1.5rem+var(--safe-top))]">
            <span class="text-[10px] font-black text-white/30 uppercase tracking-widest">素材队列 (<span id="count-span">0</span>)</span>
            <button onclick="toggleSidebar()" class="p-2 bg-white/5 rounded-full">✕</button>
        </div>
        <div id="image-list" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar pb-20"></div>
    </aside>

    <!-- 顶部工具栏：修复了按钮遮挡问题 -->
    <header id="top-bar" class="focus-hidden absolute top-0 left-0 right-0 h-20 flex items-center justify-between px-6 z-50 pointer-events-none pt-[var(--safe-top)]">
        <div class="pointer-events-auto">
            <button onclick="toggleSidebar()" class="p-3 panel-glass rounded-2xl shadow-xl btn-active">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
        <div class="flex gap-2 pointer-events-auto">
            <!-- 沉浸模式：一键全屏隐藏浏览器工具栏 -->
            <button onclick="toggleFullscreen()" class="p-3 panel-glass rounded-2xl shadow-xl btn-active">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 4h-4m4 0l-5-5"></path></svg>
            </button>
            <!-- 导入 -->
            <button onclick="showPanel('batch')" class="p-3 panel-glass rounded-2xl shadow-xl btn-active">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            </button>
            <!-- 水印设置 -->
            <button onclick="showPanel('watermark')" class="p-3 panel-glass rounded-2xl shadow-xl btn-active">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
            </button>
            <!-- 专注模式开关：现在移动到了右边这里，不挡路 -->
            <button onclick="toggleFocus()" id="focus-toggle" class="p-3 panel-glass rounded-2xl shadow-xl btn-active">
                <svg class="w-6 h-6 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <main id="viewport">
        <canvas id="main-canvas"></canvas>
        <!-- 悬浮撤销 -->
        <button id="undo-btn" onclick="undo()" class="hidden absolute left-6 bottom-44 p-5 panel-glass rounded-2xl z-80 btn-active text-white border border-white/10 shadow-2xl">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
        </button>
    </main>

    <!-- 底部控制 -->
    <footer id="bottom-bar" class="p-6 safe-bottom panel-glass border-t border-white/5 transition-all duration-300">
        <div class="max-w-2xl mx-auto flex flex-col gap-6">
            <div id="adj-area" class="focus-hidden flex flex-col gap-6">
                <div class="flex items-center justify-between">
                    <div class="flex bg-white/5 p-1 rounded-2xl border border-white/5">
                        <button onclick="setMode('mosaic')" id="m-mosaic" class="mode-btn px-6 py-3 rounded-xl transition font-black text-[10px] bg-blue-600 text-white shadow-lg">涂抹</button>
                        <button onclick="setMode('eraser')" id="m-eraser" class="mode-btn px-6 py-3 rounded-xl transition font-black text-[10px] text-white/30">橡皮</button>
                        <button onclick="setMode('watermark')" id="m-watermark" class="mode-btn px-6 py-3 rounded-xl transition font-black text-[10px] text-white/30">对位</button>
                    </div>
                    <div class="flex bg-white/5 p-1 rounded-lg">
                         <button onclick="setMaskType('blur')" id="mt-blur" class="mask-btn px-3 py-1.5 rounded-md bg-white/20 text-white font-bold text-[8px]">毛玻璃</button>
                         <button onclick="setMaskType('pixel')" id="mt-pixel" class="mask-btn px-3 py-1.5 rounded-md text-white/30 font-bold text-[8px]">马赛克</button>
                    </div>
                </div>
                <div id="sliders" class="grid grid-cols-1 sm:grid-cols-2 gap-8 items-center">
                    <div class="space-y-3">
                        <div class="flex justify-between text-[9px] font-black text-white/30 uppercase"><span>笔刷大小</span><span id="txt-bs">60px</span></div>
                        <input type="range" id="bs-range" min="5" max="500" value="60" oninput="updateUI()" class="w-full appearance-none bg-white/10 rounded-full">
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between text-[9px] font-black text-white/30 uppercase"><span>打码强度</span><span id="txt-it">30</span></div>
                        <input type="range" id="it-range" min="2" max="250" value="30" oninput="updateUI()" class="w-full appearance-none bg-white/10 rounded-full">
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex gap-2.5">
                    <button onclick="prevImg()" class="bg-white/5 border border-white/10 text-white p-5 rounded-[2.5rem] btn-active shadow-xl"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg></button>
                    <button onclick="nextImg()" class="bg-white/5 border border-white/10 text-white p-5 rounded-[2.5rem] btn-active shadow-xl"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg></button>
                </div>
                <button onclick="saveAndNext()" id="save-btn" class="flex-1 bg-blue-600 text-white h-20 rounded-[2.5rem] flex items-center justify-center gap-4 font-black shadow-[0_25px_60px_rgba(37,99,235,0.4)] btn-active disabled:opacity-20 transition-all">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span class="uppercase tracking-widest text-sm">保存并流转</span>
                </button>
            </div>
        </div>
    </footer>

    <!-- 批量面板 -->
    <div id="panel-batch" class="hidden absolute inset-x-0 bottom-[180px] p-6 z-[120]">
        <div class="max-w-md mx-auto bg-[#1a1a1c] border border-white/10 rounded-[3.5rem] shadow-2xl p-6 grid grid-cols-2 gap-4">
            <label class="flex flex-col items-center justify-center gap-4 py-12 bg-blue-600/10 border border-blue-600/20 rounded-[3rem] cursor-pointer btn-active">
                <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                <span class="text-[10px] font-black uppercase text-blue-500">添加照片</span>
                <input type="file" multiple accept="image/*" class="hidden" onchange="handleFiles(event)">
            </label>
            <button onclick="clearAll()" class="flex flex-col items-center justify-center gap-4 py-12 bg-red-600/10 border border-red-600/20 rounded-[3rem] btn-active text-red-500">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                <span class="text-[10px] font-black uppercase">清空全部</span>
            </button>
        </div>
    </div>

    <!-- 水印面板 -->
    <div id="panel-watermark" class="hidden absolute inset-x-0 bottom-[180px] p-6 z-[120]">
        <div class="max-w-md mx-auto bg-[#1a1a1c] border border-white/10 rounded-[3.5rem] shadow-2xl p-10 space-y-8">
            <div class="flex justify-between items-center border-b border-white/5 pb-4">
                <span class="text-[10px] font-black uppercase text-white/30 tracking-widest">水印全局参数</span>
                <button onclick="hidePanels()" class="p-2">✕</button>
            </div>
            <input type="text" id="wm-text" value="© 我的作品" oninput="updateWm()" class="w-full bg-black/40 border border-white/10 rounded-3xl px-8 py-5 text-center text-sm outline-none focus:ring-2 ring-blue-600">
            <div class="grid grid-cols-2 gap-8">
                <div class="space-y-2">
                    <label class="text-[9px] font-bold text-white/30 uppercase text-center block">透明度</label>
                    <input type="range" id="wm-op" min="0" max="1" step="0.1" value="0.7" oninput="updateWm()" class="w-full">
                </div>
                <div class="space-y-2">
                    <label class="text-[9px] font-bold text-white/30 uppercase text-center block">缩放</label>
                    <input type="range" id="wm-sc" min="0.1" max="8" step="0.1" value="1" oninput="updateWm()" class="w-full">
                </div>
            </div>
        </div>
    </div>

    <script>
        let images = [], currentIndex = -1, history = [], interactMode = 'mosaic', maskType = 'blur', isFocusMode = false, isDrawing = false;
        let brushSize = 60, effectIntensity = 30, wm = { text: "© 我的作品", x: 0.85, y: 0.85, scale: 1, opacity: 0.7 };
        const canvas = document.getElementById('main-canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function toggleFocus() {
            isFocusMode = !isFocusMode;
            document.body.classList.toggle('is-focus', isFocusMode);
            hidePanels();
        }

        function showPanel(id) {
            const el = document.getElementById('panel-' + id), isHidden = el.classList.contains('hidden');
            hidePanels();
            if(isHidden) el.classList.remove('hidden');
        }
        function hidePanels() {
            document.getElementById('panel-batch').classList.add('hidden');
            document.getElementById('panel-watermark').classList.add('hidden');
        }

        async function handleFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            document.getElementById('loader').style.display = 'flex';
            for (const f of files) {
                const url = URL.createObjectURL(f);
                const img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = url; });
                const mask = document.createElement('canvas');
                mask.width = img.width; mask.height = img.height;
                images.push({ name: f.name, element: img, mask, maskCtx: mask.getContext('2d'), processed: false, url });
            }
            if (currentIndex === -1 && images.length > 0) selectImg(0);
            renderList(); document.getElementById('loader').style.display = 'none'; hidePanels();
        }

        function renderList() {
            document.getElementById('count-span').innerText = images.length;
            document.getElementById('image-list').innerHTML = images.map((img, i) => `
                <div onclick="selectImg(${i})" class="flex items-center gap-4 p-3 rounded-2xl transition-all ${currentIndex === i ? 'bg-blue-600' : 'bg-white/5'}">
                    <div class="w-14 h-14 rounded-xl bg-black overflow-hidden relative flex-shrink-0">
                        <img src="${img.url}" class="w-full h-full object-cover">
                        ${img.processed ? '<div class="absolute inset-0 bg-emerald-500/60 flex items-center justify-center font-bold">✓</div>' : ''}
                    </div>
                    <p class="text-[10px] font-bold truncate flex-1">${img.name}</p>
                </div>
            `).join('');
        }

        function selectImg(i) {
            currentIndex = i; history = [];
            document.getElementById('undo-btn').classList.add('hidden');
            render(); renderList();
        }

        function prevImg() { if(currentIndex > 0) selectImg(currentIndex - 1); }
        function nextImg() { if(currentIndex < images.length - 1) selectImg(currentIndex + 1); }
        function clearAll() { images = []; currentIndex = -1; renderList(); render(); hidePanels(); }

        function render() {
            if (currentIndex === -1 || !images[currentIndex]) { ctx.clearRect(0,0,canvas.width,canvas.height); return; }
            const data = images[currentIndex];
            canvas.width = data.element.width; canvas.height = data.element.height;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.drawImage(data.element, 0, 0); ctx.drawImage(data.mask, 0, 0);
            ctx.save();
            ctx.globalAlpha = wm.opacity;
            const px = wm.x * canvas.width, py = wm.y * canvas.height;
            ctx.translate(px, py);
            const size = Math.floor(Math.min(canvas.width, canvas.height) * 0.05 * wm.scale);
            ctx.font = `bold ${size}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff'; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = size/3;
            ctx.fillText(wm.text, 0, 0);
            ctx.restore();
        }

        canvas.addEventListener('pointerdown', e => {
            if (currentIndex === -1 || e.buttons !== 1) return;
            const data = images[currentIndex];
            history.push(data.maskCtx.getImageData(0,0,data.mask.width,data.mask.height));
            if(history.length > 20) history.shift();
            document.getElementById('undo-btn').classList.remove('hidden');
            isDrawing = true; handlePointer(e);
        });
        window.addEventListener('pointermove', e => {
            if (!isDrawing || e.buttons !== 1) { isDrawing = false; return; }
            handlePointer(e);
        });
        window.addEventListener('pointerup', () => isDrawing = false);

        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect(), sx = canvas.width / rect.width, sy = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * sx, y = (e.clientY - rect.top) * sy;
            if (interactMode === 'watermark') { wm.x = x / canvas.width; wm.y = y / canvas.height; render(); }
            else {
                const data = images[currentIndex], mCtx = data.maskCtx;
                mCtx.save(); mCtx.beginPath(); mCtx.arc(x, y, brushSize, 0, Math.PI * 2); mCtx.clip();
                if (interactMode === 'eraser') { mCtx.globalCompositeOperation = 'destination-out'; mCtx.fill(); }
                else {
                    mCtx.globalCompositeOperation = 'source-over';
                    if (maskType === 'pixel') {
                        const s = Math.max(2, effectIntensity);
                        const off = document.createElement('canvas'); off.width = Math.ceil(data.element.width/s); off.height = Math.ceil(data.element.height/s);
                        off.getContext('2d').drawImage(data.element, 0, 0, off.width, off.height);
                        mCtx.imageSmoothingEnabled = false; mCtx.drawImage(off, 0, 0, data.element.width, data.element.height);
                    } else {
                        const r = Math.max(1, effectIntensity / 2);
                        const t = document.createElement('canvas'); t.width = data.element.width; t.height = data.element.height;
                        const tc = t.getContext('2d'); tc.filter = `blur(${r}px)`; tc.drawImage(data.element, 0, 0);
                        mCtx.drawImage(t, 0, 0);
                    }
                }
                mCtx.restore(); render();
            }
        }

        function undo() {
            if (!history.length) return;
            images[currentIndex].maskCtx.putImageData(history.pop(), 0, 0);
            if (!history.length) document.getElementById('undo-btn').classList.add('hidden');
            render();
        }
        function updateUI() {
            brushSize = parseInt(document.getElementById('bs-range').value);
            effectIntensity = parseInt(document.getElementById('it-range').value);
            document.getElementById('txt-bs').innerText = brushSize + 'px';
            document.getElementById('txt-it').innerText = effectIntensity;
            render();
        }
        function updateWm() {
            wm.text = document.getElementById('wm-text').value;
            wm.opacity = parseFloat(document.getElementById('wm-op').value);
            wm.scale = parseFloat(document.getElementById('wm-sc').value);
            render();
        }
        function setMode(m) {
            interactMode = m;
            document.querySelectorAll('.mode-btn').forEach(b => {
                const isActive = b.id === 'm-' + m;
                b.className = `mode-btn px-6 py-3 rounded-xl transition font-black text-[10px] ${isActive ? 'bg-blue-600 text-white shadow-lg' : 'text-white/30'}`;
            });
            render();
        }
        function setMaskType(t) {
            maskType = t;
            document.querySelectorAll('.mask-btn').forEach(b => {
                const isActive = b.id === 'mt-' + t;
                b.className = `mask-btn px-3 py-1.5 rounded-md font-bold text-[8px] transition ${isActive ? 'bg-white/20 text-white' : 'text-white/30'}`;
            });
            render();
        }

        async function saveAndNext() {
            if (currentIndex === -1) return;
            document.getElementById('loader').style.display = 'flex';
            const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
            const url = URL.createObjectURL(blob), a = document.createElement('a');
            a.href = url; a.download = `Out_${Date.now()}.jpg`; a.click();
            images[currentIndex].processed = true;
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                if (currentIndex < images.length - 1) nextImg(); else renderList();
                URL.revokeObjectURL(url);
            }, 300);
        }
    </script>
</body>
</html>
